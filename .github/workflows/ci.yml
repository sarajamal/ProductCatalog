name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet:
    name: .NET build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ProductCatalog.sln
      - name: Build
        run: dotnet build ProductCatalog.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test ProductCatalog.sln --no-build --configuration Release --verbosity normal

  angular:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/product-catalog-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/product-catalog-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
